<div class="incidents-table">
  <div class="w-full px-4 flex justify-end">
    <button
      mat-icon-button
      [matMenuTriggerFor]="columnsMenu"
    >
      <mat-icon>view_headline</mat-icon>
    </button>
  </div>
  <mat-menu #columnsMenu="matMenu">
    <div class="h-60 relative">
      <h3 class="p-2">Select collumns:</h3>
      @for (column of allColumns; track column.key) {
        <div
          class="menu-item"
          (click)="$event.stopPropagation()"
        >
          <mat-checkbox
            [checked]="displayedColumns().includes(column.key)"
            (change)="store.toggleColumn(column.key)"
          >
            {{ column.label }}
          </mat-checkbox>
        </div>
      }
    </div>
  </mat-menu>
  <div class="table-wrapper">
    <table
      mat-table
      [dataSource]="incidents()">

      @for (column of displayedColumns(); track column) {

        <ng-container [matColumnDef]="column">

          <th mat-header-cell *matHeaderCellDef>
            {{ column }}
          </th>

          <td mat-cell *matCellDef="let row" class="cursor-pointer">

            {{ formatValue(row, column) }}

          </td>

        </ng-container>

      }

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns()">
      </tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns()">
      </tr>

    </table>
  </div>

</div>

<div class="paginator-shell">
  <mat-paginator
    [length]="store.total()"
    [pageSize]="store.pageSize()"
    [pageIndex]="store.page()"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
